<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sorry Anmol ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffd9e6,#fff5f8);display:flex;align-items:center;justify-content:center;padding:18px;color:#442936}
.card{width:100%;max-width:430px;background:#fff;border-radius:28px;padding:28px 20px;text-align:center;box-shadow:0 10px 35px #b86b8328}
h1{font-size:38px;margin:5px 0 10px}.pink{color:#ed5c86}
.cat{font-size:75px;margin:10px}
.sub{font-size:17px;line-height:1.5}
button{width:100%;border:0;border-radius:30px;padding:15px;margin-top:12px;background:#ed5c86;color:#fff;font-size:17px;font-weight:bold}
.msg{margin-top:18px;padding:18px;border:2px dashed #f1b9c9;border-radius:20px;min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:9px;line-height:1.5}
.note{display:none;margin-top:15px;background:#fff7fa;border-radius:18px;padding:18px;text-align:left;max-height:300px;overflow:auto;line-height:1.7}
.note h2{text-align:center;margin:0 0 10px;color:#e64f7c}
.end{text-align:center;font-weight:bold;color:#e64f7c;margin-top:12px}
.heart{position:fixed;bottom:-30px;animation:up 2.5s linear forwards;font-size:25px;pointer-events:none}
@keyframes up{to{transform:translateY(-110vh);opacity:0}}
</style>
</head>
<body>
<div class="card">
<h1>Sorry <span class="pink">Anmol ❤️</span></h1>
<div class="cat">🐱💗</div>
<div class="sub">Ek baar click karo 🥺<br>Hopefully mujhe maaf kar doge ❤️</div>

<button id="sorry">💌 Click Me 💌</button>

<div class="msg" id="msg">
<div>I know I made a mistake, and I'm genuinely sorry.</div>
<div>You mean so much to me. ❤️</div>
<strong>Please forgive me? 🥺</strong>
</div>

<button id="hundred">💗 100 Times Sorry 💗</button>

<div class="note" id="note">
<h2>For Anmol 🥺❤️</h2>
<div id="list"></div>
<div class="end">Ab maan bhi jao na, Anmol 🥹❤️</div>
</div>
</div>

<script>
(function(){
var messages=[
["Sorry Anmol 🥺❤️","Please maan jao na 🥹","Galti ho gayi... I'm really sorry."],
["Anmol, naraz mat raho na 💕","Tumhari smile bahut precious hai.","Please mujhe maaf kar do 🥺"],
["100 baar sorry bolun tab bhi kam hai 😭💗","SORRY SORRY SORRY!","Ab thoda sa maan jao na? 🥹"],
["Mujhe tumhe hurt nahi karna chahiye tha.","I'm really sorry ❤️","Please meri baat sun lo."]
];
var msg=document.getElementById("msg");
document.getElementById("sorry").onclick=function(){
var a=messages[Math.floor(Math.random()*messages.length)];
msg.innerHTML="<div>"+a[0]+"</div><div>"+a[1]+"</div><strong>"+a[2]+"</strong>";
for(var i=0;i<7;i++) setTimeout(heart,i*80);
};
document.getElementById("hundred").onclick=function(){
var list=document.getElementById("list");
if(!list.innerHTML){
for(var i=1;i<=100;i++) list.innerHTML+=i+". Sorry 🥺❤️<br>";
}
document.getElementById("note").style.display="block";
for(var i=0;i<10;i++) setTimeout(heart,i*70);
};
function heart(){
var h=document.createElement("div");
h.className="heart";h.innerHTML=["❤️","💗","💕","🥺","🫶"][Math.floor(Math.random()*5)];
h.style.left=(Math.random()*95)+"vw";
document.body.appendChild(h);
setTimeout(function(){h.remove()},2700);
}
})();
</script>
</body>
</html>
